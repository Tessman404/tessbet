<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b22">
<title>Tessbet</title>
<style>
:root {
  --turf: #0d2b22;
  --turf-2: #143a2d;
  --turf-3: #1d4d3b;
  --chalk: #cfe3d8;
  --chalk-dim: #8fb0a0;
  --ticket: #f1f5f3;
  --ink: #10201a;
  --ink-2: #4b5f56;
  --yellow: #ffd23f;
  --red: #e5383b;
  --green: #2fbf71;
  --display: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--turf); color: var(--chalk);
  font: 16px/1.5 var(--text); padding-bottom: 32px;
}
button, input, select { font: inherit; color: inherit; }
input, select { color: var(--ink); background: #fff; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* Cercle central tracé à la craie : le seul décor de la page */
.pitch-mark { position: absolute; inset: 0 0 auto 0; height: 360px; overflow: hidden; pointer-events: none; }
.pitch-mark svg { position: absolute; right: -90px; top: -70px; width: 330px; opacity: .09; }
.wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 18px 18px 0; }

header { margin-bottom: 14px; }
header h1 { margin: 0; font: 700 2.6rem/1 var(--display); letter-spacing: .01em; color: #fff; }
header .date { margin: 6px 0 0; color: var(--chalk-dim); font-size: .95rem; }
.summary { margin: 8px 0 18px; font-size: 1.05rem; color: var(--chalk); max-width: 60ch; }
.banner {
  margin: 16px 0 0; padding: 10px 12px; border: 1.5px dashed var(--yellow); border-radius: 10px;
  color: var(--yellow); font-size: .9rem;
}

/* ---- Ticket ---- */
.ticket {
  position: relative; display: grid; grid-template-columns: 1fr 112px; margin: 0 0 18px;
  background: var(--ticket); color: var(--ink); border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.28);
}
.ticket .body { padding: 16px 16px 14px 18px; min-width: 0; }
.ticket .stub {
  position: relative; background: var(--yellow); border-radius: 0 16px 16px 0; padding: 16px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  border-left: 2px dashed rgba(16,32,26,.45);
}
.ticket .stub::before, .ticket .stub::after {
  content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--turf);
}
.ticket .stub::before { top: -10px; }
.ticket .stub::after { bottom: -10px; }
.odds { font: 700 2.7rem/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.stub small { margin-top: 6px; font-size: .78rem; line-height: 1.25; color: rgba(16,32,26,.78); overflow-wrap: anywhere; }

.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); font-size: .85rem; }
.pick { margin: 6px 0 2px; font: 700 1.4rem/1.15 var(--display); }
.match { margin: 0; color: var(--ink-2); font-size: .95rem; overflow-wrap: anywhere; }

.proba { margin: 14px 0 4px; }
.proba .row { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; }
.proba strong { font: 700 1.25rem/1 var(--display); }
.track { position: relative; height: 8px; margin-top: 7px; border-radius: 4px; background: #d5e0da; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--turf-3); }
.track b { position: absolute; top: -3px; width: 1.5px; height: 14px; background: rgba(16,32,26,.35); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.chip { padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; border: 1.5px solid var(--ink); }
.chip.high { background: var(--turf-3); border-color: var(--turf-3); color: #fff; }
.chip.good { background: transparent; border-color: var(--turf-3); color: var(--turf-3); }
.chip.mid  { background: transparent; border-color: var(--ink-2); color: var(--ink-2); }
.chip.deal { background: var(--yellow); border-color: var(--ink); color: var(--ink); }
.chip.fav  { background: transparent; border-style: dashed; border-color: var(--ink-2); color: var(--ink-2); }

.claude { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #e3ebe7; border-left: 4px solid var(--turf-3); }
.claude strong { font-size: .92rem; }
.claude p { margin: 3px 0 0; font-size: .9rem; color: var(--ink-2); }
.claude.prudence { background: #fff3cf; border-left-color: #c98a00; }
.claude.none { background: #f6e3e3; border-left-color: var(--red); }
details a { color: var(--turf-3); font-weight: 600; }
details { margin-top: 12px; }
summary { cursor: pointer; font-weight: 600; font-size: .92rem; padding: 4px 0; }
details ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: .9rem; }
details li { margin: 4px 0; }

.actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #d5e0da; }
.actions .stake { font-size: .88rem; color: var(--ink-2); }
.actions .stake b { color: var(--ink); font-size: 1rem; }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; background: var(--ink); color: #fff; min-height: 40px; white-space: nowrap; }
.btn.ghost { background: transparent; border: 1.5px solid currentColor; }
.btn.small { padding: 6px 10px; min-height: 34px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: default; }
.betform { display: flex; margin-top: 12px; gap: 8px; align-items: center; flex-wrap: wrap; }
.betform.open { display: flex; }
.betform input {
  width: 84px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--ink-2);
  background: #fff; color: var(--ink); font-size: 1rem;
}
.betform label { font-size: .9rem; color: var(--ink-2); }

/* ---- états vides / info ---- */
.empty { border: 1.5px dashed var(--chalk-dim); border-radius: 16px; padding: 22px 18px; }
.empty h2 { margin: 0 0 6px; font: 700 1.4rem/1.15 var(--display); color: #fff; }
.empty p { margin: 0; color: var(--chalk); }
.note { margin: 22px 0 0; font-size: .85rem; color: var(--chalk-dim); }
.warn { margin: 12px 0 0; font-size: .85rem; color: var(--yellow); }
.refresh { margin-top: 6px; background: transparent; border: 1.5px solid var(--chalk-dim); color: var(--chalk); }

/* ---- suivi ---- */
.bank { margin: 4px 0 4px; font: 700 3.1rem/1 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.bank-sub { margin: 0 0 20px; color: var(--chalk-dim); }
.pos { color: var(--green); } .neg { color: #ff7478; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.cell { background: var(--turf-2); border-radius: 12px; padding: 12px; }
.cell span { display: block; font-size: .82rem; color: var(--chalk-dim); }
.cell strong { font: 700 1.5rem/1.2 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.limit { background: var(--turf-2); border-radius: 12px; padding: 14px; margin-bottom: 22px; }
.limit .row { display: flex; justify-content: space-between; font-size: .92rem; }
.limit .track { background: var(--turf); height: 10px; }
.limit .track i { background: var(--yellow); }
.limit .track.over i { background: var(--red); }
.limit p { margin: 8px 0 0; font-size: .85rem; color: var(--chalk-dim); }
h2.section { margin: 26px 0 10px; font: 700 1.35rem/1.2 var(--display); color: #fff; }
.bet { background: var(--turf-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.bet .top { display: flex; justify-content: space-between; gap: 10px; }
.bet .name { font-weight: 600; overflow-wrap: anywhere; }
.bet .sub { color: var(--chalk-dim); font-size: .88rem; overflow-wrap: anywhere; }
.bet .res { font: 700 1.2rem/1 var(--display); white-space: nowrap; }
.bet .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn.win { background: var(--green); color: var(--ink); }
.btn.lose { background: var(--red); color: #fff; }
.btn.void, .btn.del { background: transparent; border: 1.5px solid var(--chalk-dim); color: var(--chalk); }
.settings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.settings input { width: 120px; min-height: 38px; padding: 8px 10px; border-radius: 8px; border: 1px solid #b9c8bf; background: #fff; color: var(--ink); }
.settings .btn { background: var(--chalk); color: var(--ink); }

/* ---- barre du haut ---- */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--turf-2); border-bottom: 1px solid var(--turf-3); padding-top: env(safe-area-inset-top); }
.topbar .in { max-width: 1080px; margin: 0 auto; padding: 0 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { font: 700 1.5rem/1 var(--display); color: #fff; padding: 12px 0; }
.topbar nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.topbar nav button { background: transparent; border: 0; padding: 14px 14px 11px; color: var(--chalk-dim); font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; }
.topbar nav button:hover { color: #fff; }
.topbar nav button[aria-current="page"] { color: #fff; border-bottom-color: var(--yellow); }
.pagehead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.pagehead h1 { margin: 0; font: 700 1.9rem/1.1 var(--display); color: #fff; }
.pagehead .date { margin: 0; color: var(--chalk-dim); }
#date::first-letter { text-transform: uppercase; }
.cols { display: grid; grid-template-columns: 1fr; gap: 0 20px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .cols.three { grid-template-columns: 1fr 1fr 1fr; } }
.panel { background: var(--turf-2); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.panel h2 { margin: 0 0 10px; font: 700 1.2rem/1.2 var(--display); color: #fff; }
.panel .autobox { margin-bottom: 10px; }
.panel .wallet b { min-width: 110px; }
.livecard { background: var(--turf-2); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
.livecard .lt { display: flex; justify-content: space-between; color: var(--chalk-dim); font-size: .88rem; }
.livecard .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 8px 0; }
.livecard .teams span { font-weight: 600; overflow-wrap: anywhere; }
.livecard .teams span:last-child { text-align: right; }
.livecard .score { font: 700 2.3rem/1 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.livecard .dot { color: #ff5a5f; font-weight: 700; }
.livecard .mine { color: var(--chalk); font-size: .9rem; }
.badge { margin: 6px 0; padding: 8px 12px; border-radius: 10px; font-weight: 700; background: var(--turf-3); color: #fff; }
.badge.winning, .badge.won { background: #1f7a4d; }
.badge.losing, .badge.lost { background: #a32a2d; }
.badge.draw { background: #8a6d00; }
.badge.none { background: var(--turf-3); color: var(--chalk-dim); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--turf-3); white-space: nowrap; }
th { color: var(--chalk-dim); font-weight: 600; font-size: .82rem; }
.edit { display: none; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.edit.open { display: flex; }
.edit select { min-height: 38px; border-radius: 8px; border: 1px solid #b9c8bf; padding: 0 8px; }
.edit input { width: 90px; min-height: 38px; border-radius: 8px; border: 1px solid #b9c8bf; padding: 0 8px; }
.edit label { font-size: .88rem; color: var(--chalk-dim); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .92rem;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); z-index: 10;
}
.toast.err { background: var(--red); }
[hidden] { display: none !important; }
@media (max-width: 380px) { .ticket { grid-template-columns: 1fr 96px; } .odds { font-size: 2.3rem; } }
@media (max-width: 600px) { .brand { width: 100%; padding: 10px 0 0; } .topbar .in { gap: 0; } .topbar nav { width: 100%; flex: none; } .topbar nav button { padding: 10px 12px 9px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.autobox { display:flex; align-items:center; gap:10px; margin:0 0 14px; color:#fff; font-size:.95rem; }
.autobox select { min-height:34px; border-radius:8px; padding:0 6px; background:#fff; color:var(--ink); }
.autobox input { width:22px; height:22px; accent-color:#ffd23f; }
.offers { margin:10px 0 0; font-size:.82rem; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.offers a { text-decoration:none; color:inherit; padding:2px 8px; border:1px solid #c5d3cb; border-radius:99px; }
.offers a.mine { background:#ffd23f; border-color:#ffd23f; font-weight:700; }
.betlink { display:inline-block; margin-top:10px; text-decoration:none; background:#0d2b22; color:#fff; padding:9px 14px; border-radius:10px; font-weight:700; }
.offers span { padding:2px 8px; border:1px solid #c5d3cb; border-radius:99px; }
.offers span.mine { background:#ffd23f; border-color:#ffd23f; color:var(--ink); font-weight:700; }
.betform select { min-height:36px; border-radius:8px; border:1px solid #b9c8bf; padding:0 8px; background:#fff; color:var(--ink); }
.wallet { display:flex; align-items:center; gap:8px; margin:8px 0; color:#fff; flex-wrap:wrap; }
.wallet b { min-width:92px; }
.wallet input, .wallet select { min-height:38px; border-radius:8px; border:1px solid #b9c8bf; padding:0 8px; background:#fff; color:var(--ink); }
.wallet input { width:110px; }
.copy { margin-top:10px; }
.analyse { margin:8px 0 4px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid #d5e0da; }
.analyse h3 { margin:0 0 8px; font:700 1rem var(--display); }
.analyse p { margin:0 0 9px; line-height:1.45; font-size:.93rem; color:var(--ink); }
.analyse p:last-child { margin-bottom:0; }
</style>
</head>
<body>
<div class="pitch-mark" aria-hidden="true">
  <svg viewBox="0 0 400 400" fill="none" stroke="#cfe3d8" stroke-width="5">
    <circle cx="200" cy="200" r="150"/><circle cx="200" cy="200" r="7" fill="#cfe3d8"/><path d="M0 200h400"/>
  </svg>
</div>

<div class="topbar"><div class="in">
  <span class="brand">Tessbet</span>
  <nav aria-label="Navigation">
    <button type="button" data-tab="today" aria-current="page">Aujourd'hui</button>
    <button type="button" data-tab="live">En direct</button>
    <button type="button" data-tab="past">Passés</button>
    <button type="button" data-tab="track">Mes mises</button>
    <button type="button" data-tab="settings">Réglages</button>
  </nav>
</div></div>

<main class="wrap">
  <section id="tab-today">
    <div class="pagehead"><h1>Aujourd'hui</h1><p class="date" id="date"></p></div>
    <div id="demo-banner" class="banner" hidden>Mode démo : les matchs et les cotes sont fictifs. Ne parie rien d'après cet écran.</div>
    <p class="summary" id="summary"></p>
    <div id="tickets" class="cols"></div>
    <p class="warn" id="warnings"></p>
    <div id="launcher" class="panel"></div>
    <p class="note" id="disclaimer"></p>
  </section>

  <section id="tab-live" hidden>
    <div class="pagehead"><h1>En direct</h1><p class="date" id="livestamp"></p></div>
    <div id="live-box" class="cols"></div>
  </section>

  <section id="tab-past" hidden>
    <div class="pagehead"><h1>Passés</h1></div>
    <div id="past"></div>
  </section>

  <section id="tab-track" hidden>
    <div class="pagehead"><h1>Mes mises</h1></div>
    <div id="track"></div>
  </section>

  <section id="tab-settings" hidden>
    <div class="pagehead"><h1>Réglages</h1></div>
    <div id="settings-box" class="cols"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" hidden></div>

<script>
const SPORT = { football: '⚽', basketball: '🏀', tennis: '🎾' };
const state = { today: null, stats: null, bets: [] };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
}
const bookName = k => ((state.stats && state.stats.books.find(x => x.key === k)) || {}).name || k;
const safeUrl = u => { try { return new URL(u).protocol === 'https:' ? u : null; } catch (_) { return null; } };
const eur = n => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
const signedEur = n => (n > 0 ? '+' : n < 0 ? '−' : '') + eur(Math.abs(n));
const pct = (x, d = 0) => (x * 100).toFixed(d).replace('.', ',') + ' %';
const odds = x => x.toFixed(2).replace('.', ',');

async function api(path, method = 'GET', body) {
  const r = await fetch('api/' + path, {
    method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Une erreur est survenue.'), { status: r.status, data: j });
  return j;
}

let toastTimer;
function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
}

/* ---------------- Aujourd'hui ---------------- */
function shareText(s) {
  const cl = s.claude || {};
  const sport = SPORT[s.sport] || '';
  const lines = [`${sport} ${s.league} – ${s.pick_label}`, `${s.match} (${s.kickoff_local})`,
    `Cote ${odds(s.odds)} (${s.bookmaker}) – ${pct(s.prob)} de chances estimées`];
  if (cl.resume) lines.push('', `Claude : ${cl.resume}`);
  if (cl.analyse) lines.push('', cl.analyse);
  if (cl.sources && cl.sources.length) lines.push('', 'Sources : ' + cl.sources.join(' '));
  lines.push('', 'Aucun pari n\'est sûr : ne mise que ce que tu peux perdre. Aide : Joueurs Info Service 09 74 75 13 13.', '— Tessbet');
  return lines.join('\n');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.append(t); t.focus(); t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  t.remove();
  return ok;
}

function ticket(s) {
  const bank = state.stats ? state.stats.bankroll : 0;
  const suggested = Math.max(0.5, Math.round(bank * s.stake_pct * 2) / 2);
  const conf = { 'Élevée': 'high', 'Bonne': 'good', 'Moyenne': 'mid' }[s.confidence] || 'mid';
  const input = el('input', { type: 'number', min: '0.5', step: '0.5', value: String(suggested), id: 'stake-' + s.id, inputmode: 'decimal' });
  const books = state.stats ? state.stats.books : [];
  const baseOf = k => k.replace(/_fr$/, '');
  const offerOf = bk => (s.offers || []).find(o => baseOf(o.key) === bk.key);
  const mine = books.filter(bk => ['winamax', 'unibet'].includes(bk.key) && offerOf(bk));
  const bestMine = mine.sort((x, y) => offerOf(y).odds - offerOf(x).odds)[0];
  const bookSel = el('select', { id: 'book-' + s.id, 'aria-label': 'Bookmaker' },
    el('option', { value: '', text: 'Choisis le site' }), books.map(bk => el('option', { value: bk.key, text: bk.name })));
  const oddsInput = el('input', { type: 'number', min: '1.01', step: '0.01', value: String((bestMine ? offerOf(bestMine).odds : s.odds)), id: 'odds-' + s.id, inputmode: 'decimal' });
  if (bestMine) bookSel.value = bestMine.key;
  bookSel.addEventListener('change', () => {
    const bk = books.find(x => x.key === bookSel.value); const o = bk && offerOf(bk);
    if (o) oddsInput.value = String(o.odds);
  });
  const form = el('div', { class: 'betform' },
    el('label', { for: 'book-' + s.id, text: 'Site' }), bookSel,
    el('label', { for: 'odds-' + s.id, text: 'Cote' }), oddsInput,
    el('label', { for: 'stake-' + s.id, text: 'Mise (€)' }), input,
    el('button', { class: 'btn small', type: 'button', text: 'J\'ai parié',
      onclick: () => saveBet(s, input.value, oddsInput.value, bookSel.value, false) }));
  const offerChips = (s.offers || []).length ? el('p', { class: 'offers' }, 'Cotes : ',

async function saveBet(s, stakeValue, oddsValue, book, force) {

  try {
    await api('bets', 'POST', { match: s.match, pick: s.pick_label, odds: Number(oddsValue) || s.odds, stake: Number(stakeValue), sport: s.sport, book, force, league_key: s.league_key, pick_team: s.pick_team, kickoff: s.kickoff });

function evolution(s) {
  const wrap = el('div', {});
  const pts = [{ bankroll: s.bankroll_start, label: 'Départ' }, ...s.series];
  wrap.append(el('h2', { class: 'section', text: 'Évolution de mon argent' }));
  if (s.series.length) {
    const W = 600, H = 200, P = 28;
    const ys = pts.map(p => p.bankroll), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
    const X = i => P + (pts.length === 1 ? 0 : i * (W - 2 * P) / (pts.length - 1));
    const Y = v => H - P - (v - lo) / span * (H - 2 * P);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Courbe de mon argent après chaque pari terminé');
    const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text) n.textContent = text; svg.append(n); };
    add('line', { x1: P, x2: W - P, y1: Y(s.bankroll_start), y2: Y(s.bankroll_start), stroke: '#8fb0a0', 'stroke-dasharray': '4 4', 'stroke-width': 1 });
    add('polyline', { points: pts.map((p, i) => `${X(i)},${Y(p.bankroll)}`).join(' '), fill: 'none', stroke: '#ffd23f', 'stroke-width': 3, 'stroke-linejoin': 'round' });
    pts.forEach((p, i) => add('circle', { cx: X(i), cy: Y(p.bankroll), r: 4.5, fill: i && p.profit < 0 ? '#ff7478' : '#2fbf71' }));
    add('text', { x: P, y: 14, fill: '#cfe3d8', 'font-size': 12 }, 'Max ' + eur(hi));
    add('text', { x: P, y: H - 6, fill: '#8fb0a0', 'font-size': 12 }, 'Min ' + eur(lo));
    add('text', { x: W - P, y: 14, fill: '#fff', 'font-size': 13, 'text-anchor': 'end', 'font-weight': 700 }, 'Aujourd\'hui ' + eur(s.bankroll));
    wrap.append(el('div', { class: 'panel' }, svg, el('p', { class: 'note', text: `Départ ${eur(s.bankroll_start)} → maintenant ${eur(s.bankroll)} (${signedEur(s.profit)}). Un point = un pari terminé.` })));
  } else wrap.append(el('p', { class: 'note', text: 'La courbe apparaît dès ton premier pari terminé.' }));
  wrap.append(el('h2', { class: 'section', text: 'Par bookmaker' }));
  wrap.append(el('div', { class: 'panel tablewrap' }, el('table', {},
    el('thead', {}, el('tr', {}, ['Site', 'Paris', 'Misé', 'Résultat', 'Solde estimé'].map(t => el('th', { text: t })))),
    el('tbody', {}, s.by_book.map(x => el('tr', {}, el('td', { text: x.name }), el('td', { text: String(x.n) }), el('td', { text: eur(x.staked) }),
      el('td', { class: x.profit > 0 ? 'pos' : x.profit < 0 ? 'neg' : '', text: signedEur(x.profit) }), el('td', { text: eur(x.balance) }))))),
    el('p', { class: 'note', text: 'Solde estimé = ce que tu as engagé sur le site + ce que tu y as gagné ou perdu. « Non précisé » : modifie le pari pour choisir son site.' })));
  if (s.by_day.length) {
    wrap.append(el('h2', { class: 'section', text: 'Jour par jour' }));
    wrap.append(el('div', { class: 'panel tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ['Jour', 'Paris', 'Misé', 'Résultat'].map(t => el('th', { text: t })))),
      el('tbody', {}, s.by_day.map(x => el('tr', {}, el('td', { text: new Date(x.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) }),
        el('td', { text: String(x.n) }), el('td', { text: eur(x.staked) }), el('td', { class: x.profit > 0 ? 'pos' : x.profit < 0 ? 'neg' : '', text: signedEur(x.profit) })))))));
  }
  return wrap;
}

async function launch(source, refire) {
  if (source === 'api' && !confirm('L\'analyse par l\'API coûte des crédits sur ta clé Anthropic. Lancer quand même ?')) return;
  const btns = document.querySelectorAll('#launcher button'); btns.forEach(x => x.disabled = true);
  try {
    state.today = await api('refresh', 'POST', { force: true, source, confirm: source === 'api', refire: !!refire });
    renderToday();
    const f = state.today.fire || {};
    if (!state.today.waiting) toast('Analyse mise à jour.');
    else if (f.status === 'error') toast('Claude n\'a pas pu être réveillé : ' + f.error + '.', true);
    else if (f.status === 'manual') toast('Réveil automatique non réglé : colle le jeton de la tâche Claude dans les réglages de l\'application.', true);
    else toast('Claude est prévenu. Le résultat arrivera ici tout seul.');
  } catch (err) { toast(err.message, true); }
  renderLauncher();
  watchWaiting();
}
let waitTimer = null;
function watchWaiting() {
  clearInterval(waitTimer); waitTimer = null;
  if (!(state.today && state.today.waiting)) return;
  waitTimer = setInterval(async () => {  // pendant que Claude travaille, on regarde si la réponse est arrivée
    try {
      const d = await api('today');
      if (d.waiting && d.date === state.today.date) return;
      state.today = d; renderToday(); clearInterval(waitTimer); waitTimer = null;
      toast('Claude a répondu : analyse du jour à jour.');
    } catch (_) {}
  }, 30000);
}
function hhmm(iso) { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
async function renderLauncher() {
  const box = document.getElementById('launcher');
  let st = { source: 'api' }; try { st = await api('settings'); } catch (_) {}
  box.replaceChildren();
  const d = state.today || {};
  const waitMin = d.waiting && d.generated_at ? (Date.now() - new Date(d.generated_at).getTime()) / 60000 : 0;
  box.append(el('h2', { text: 'Analyse du jour' }),
    el('p', { class: 'note', text: 'Rien ne se lance sans ton accord. Tu peux le faire à toute heure, même après minuit.' }));
  if (st.source === 'claude_task') {
    const f = d.fire || {};
    box.append(el('button', { class: 'btn small', type: 'button', text: d.waiting ? (waitMin < 20 ? 'Revérifier la réponse de Claude' : 'Relancer Claude') : 'Demander à Claude (sans frais d\'API)',
      onclick: () => launch('claude_task', d.waiting && waitMin >= 20) }));
    if (d.waiting) {
      let msg;
      if (f.status === 'error') msg = 'Claude n\'a pas pu être réveillé : ' + f.error + '. Tu peux réessayer avec « Relancer Claude » (après 20 min) ou en revérifiant.';
      else if (f.status === 'manual' || !st.routine) msg = 'Le réveil automatique n\'est pas réglé : colle le jeton de la tâche Claude dans les réglages de l\'application (Paramètres > Applications > Tessbet > Configuration).';
      else msg = 'Claude travaille' + (f.fired_at ? ' (lancé à ' + hhmm(f.fired_at) + ')' : '') + ' : le résultat s\'affichera ici tout seul, compte 10 à 20 minutes.';
      box.append(el('p', { class: 'note', text: msg }));
      if (waitMin >= 20) box.append(el('p', { class: 'note', text: 'Ça dure ? Tu peux relancer Claude, ou utiliser l\'API (elle coûte des crédits).' }),
        el('button', { class: 'btn small', type: 'button', text: 'Claude indisponible : utiliser l\'API (crédits)', onclick: () => launch('api') }));
    }
  } else {
    box.append(el('button', { class: 'btn small', type: 'button', text: 'Lancer l\'analyse avec l\'API (crédits)', onclick: () => launch('api') }));
  }
}

async function showTab(t) {
  document.querySelectorAll('.topbar nav button').forEach(x => x.toggleAttribute('aria-current', x.dataset.tab === t));
  document.querySelectorAll('.topbar nav button[aria-current]').forEach(x => x.setAttribute('aria-current', 'page'));
  ['today', 'live', 'past', 'track', 'settings'].forEach(n => document.getElementById('tab-' + n).hidden = n !== t);
  clearInterval(liveTimer); liveTimer = null;
  try {
    if (t === 'past') renderPast((await api('history')).days);
    if (t === 'track') { await Promise.all([loadStats(), loadBets()]); renderTrack(); }
    if (t === 'settings') { await Promise.all([loadStats(), loadToday()]); renderSettings(await api('settings')); }
    if (t === 'live') { await renderLive(); liveTimer = setInterval(renderLive, 20000); }
  } catch (e) { toast(e.message, true); }
  window.scrollTo(0, 0);
}
document.querySelectorAll('.topbar nav button').forEach(btn => btn.addEventListener('click', () => showTab(btn.dataset.tab)));

(async () => {
  try { await Promise.all([loadToday(), loadStats(), loadBets()]); renderToday(); renderTrack(); watchWaiting(); }
  catch (e) { document.getElementById('summary').textContent = 'Impossible de joindre le serveur : ' + e.message; }
})();
</script>
