<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b22">
<title>Tessbet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231d4d3b%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230a2219%22/%3E%3C/linearGradient%3E%20%3ClinearGradient%20id%3D%22tk%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffe066%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ffc61a%22/%3E%3C/linearGradient%3E%20%3CclipPath%20id%3D%22sq%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22/%3E%3C/clipPath%3E%20%3C/defs%3E%20%3Cg%20clip-path%3D%22url%28%23sq%29%22%3E%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22url%28%23bg%29%22/%3E%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22196%22%20fill%3D%22none%22%20stroke%3D%22%23cfe3d8%22%20stroke-opacity%3D%22.10%22%20stroke-width%3D%2210%22/%3E%20%3Cpath%20d%3D%22M0%20256H512%22%20stroke%3D%22%23cfe3d8%22%20stroke-opacity%3D%22.10%22%20stroke-width%3D%2210%22/%3E%20%3C/g%3E%20%3Cg%20transform%3D%22rotate%28-9%20256%20256%29%22%3E%20%3Cpath%20fill%3D%22url%28%23tk%29%22%20d%3D%22M110%20150h292a26%2026%200%200%201%2026%2026v38a28%2028%200%200%200%200%2056v66a26%2026%200%200%201-26%2026H110a26%2026%200%200%201-26-26v-66a28%2028%200%200%200%200-56v-38a26%2026%200%200%201%2026-26z%22/%3E%20%3Cpath%20d%3D%22M346%20168v176%22%20stroke%3D%22%230d2b22%22%20stroke-opacity%3D%22.45%22%20stroke-width%3D%227%22%20stroke-dasharray%3D%2214%2012%22%20stroke-linecap%3D%22round%22/%3E%20%3Cpath%20fill%3D%22%230d2b22%22%20d%3D%22M128%20196h176v44h-64v124h-48v-124h-64z%22/%3E%20%3Cpath%20d%3D%22M370%20306l14%2016%2026-38%22%20fill%3D%22none%22%20stroke%3D%22%230d2b22%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%20%3C/g%3E%20%3C/svg%3E">
<style>
:root {
  --turf: #0d2b22;
  --turf-2: #143a2d;
  --turf-3: #1d4d3b;
  --chalk: #cfe3d8;
  --chalk-dim: #8fb0a0;
  --ticket: #f1f5f3;
  --ink: #10201a;
  --ink-2: #4b5f56;
  --yellow: #ffd23f;
  --red: #e5383b;
  --green: #2fbf71;
  --display: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--turf); color: var(--chalk);
  font: 16px/1.5 var(--text); padding-bottom: 32px;
}
button, input, select { font: inherit; color: inherit; }
input, select { color: var(--ink); background: #fff; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* Cercle central tracé à la craie : le seul décor de la page */
.pitch-mark { position: absolute; inset: 0 0 auto 0; height: 360px; overflow: hidden; pointer-events: none; }
.pitch-mark svg { position: absolute; right: -90px; top: -70px; width: 330px; opacity: .09; }
.wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 18px 18px 0; }

header { margin-bottom: 14px; }
header h1 { margin: 0; font: 700 2.6rem/1 var(--display); letter-spacing: .01em; color: #fff; }
header .date { margin: 6px 0 0; color: var(--chalk-dim); font-size: .95rem; }
.summary:empty { display: none; }
.summary { margin: 8px 0 18px; font-size: 1.05rem; color: var(--chalk); max-width: 60ch; }
.banner {
  margin: 16px 0 0; padding: 10px 12px; border: 1.5px dashed var(--yellow); border-radius: 10px;
  color: var(--yellow); font-size: .9rem;
}

/* ---- Ticket ---- */
.ticket {
  position: relative; display: grid; grid-template-columns: 1fr 112px; margin: 0 0 18px;
  background: var(--ticket); color: var(--ink); border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.28);
}
.ticket .body { padding: 16px 16px 14px 18px; min-width: 0; }
.ticket .stub {
  position: relative; background: var(--yellow); border-radius: 0 16px 16px 0; padding: 16px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  border-left: 2px dashed rgba(16,32,26,.45);
}
.ticket .stub::before, .ticket .stub::after {
  content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--turf);
}
.ticket .stub::before { top: -10px; }
.ticket .stub::after { bottom: -10px; }
.odds { font: 700 2.7rem/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.stub small { margin-top: 6px; font-size: .78rem; line-height: 1.25; color: rgba(16,32,26,.78); overflow-wrap: anywhere; }

.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); font-size: .85rem; }
.pick { margin: 6px 0 2px; font: 700 1.4rem/1.15 var(--display); }
.match { margin: 0; color: var(--ink-2); font-size: .95rem; overflow-wrap: anywhere; }

.proba { margin: 14px 0 4px; }
.proba .row { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; }
.proba strong { font: 700 1.25rem/1 var(--display); }
.track { position: relative; height: 8px; margin-top: 7px; border-radius: 4px; background: #d5e0da; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--turf-3); }
.track b { position: absolute; top: -3px; width: 1.5px; height: 14px; background: rgba(16,32,26,.35); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.chip { padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; border: 1.5px solid var(--ink); }
.chip.high { background: var(--turf-3); border-color: var(--turf-3); color: #fff; }
.chip.good { background: transparent; border-color: var(--turf-3); color: var(--turf-3); }
.chip.mid  { background: transparent; border-color: var(--ink-2); color: var(--ink-2); }
.chip.deal { background: var(--yellow); border-color: var(--ink); color: var(--ink); }
.chip.fav  { background: transparent; border-style: dashed; border-color: var(--ink-2); color: var(--ink-2); }

.claude { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #e3ebe7; border-left: 4px solid var(--turf-3); }
.claude strong { font-size: .92rem; }
.claude p { margin: 3px 0 0; font-size: .9rem; color: var(--ink-2); }
.claude.prudence { background: #fff3cf; border-left-color: #c98a00; }
.claude.none { background: #f6e3e3; border-left-color: var(--red); }
details a { color: var(--turf-3); font-weight: 600; }
details { margin-top: 12px; }
summary { cursor: pointer; font-weight: 600; font-size: .92rem; padding: 4px 0; }
details ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: .9rem; }
details li { margin: 4px 0; }

.actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #d5e0da; }
.actions .stake { font-size: .88rem; color: var(--ink-2); }
.actions .stake b { color: var(--ink); font-size: 1rem; }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; background: var(--ink); color: #fff; min-height: 40px; white-space: nowrap; }
.btn.ghost { background: transparent; border: 1.5px solid currentColor; }
.btn.small { padding: 6px 10px; min-height: 34px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: default; }
.betform { display: flex; margin-top: 12px; gap: 8px; align-items: center; flex-wrap: wrap; }
.betform.open { display: flex; }
.betform input {
  width: 84px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--ink-2);
  background: #fff; color: var(--ink); font-size: 1rem;
}
.betform label { font-size: .9rem; color: var(--ink-2); }

/* ---- états vides / info ---- */
.empty { border: 1.5px dashed var(--chalk-dim); border-radius: 16px; padding: 22px 18px; }
.empty h2 { margin: 0 0 6px; font: 700 1.4rem/1.15 var(--display); color: #fff; }
.empty p { margin: 0; color: var(--chalk); }
.note { margin: 22px 0 0; font-size: .85rem; color: var(--chalk-dim); }
.warn { margin: 12px 0 0; font-size: .85rem; color: var(--yellow); }
.refresh { margin-top: 6px; background: transparent; border: 1.5px solid var(--chalk-dim); color: var(--chalk); }

/* ---- suivi ---- */
.bank { margin: 4px 0 4px; font: 700 3.1rem/1 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.bank-sub { margin: 0 0 20px; color: var(--chalk-dim); }
.pos { color: var(--green); } .neg { color: #ff7478; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.cell { background: var(--turf-2); border-radius: 12px; padding: 12px; }
.cell span { display: block; font-size: .82rem; color: var(--chalk-dim); }
.cell strong { font: 700 1.5rem/1.2 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.limit { background: var(--turf-2); border-radius: 12px; padding: 14px; margin-bottom: 22px; }
.limit .row { display: flex; justify-content: space-between; font-size: .92rem; }
.limit .track { background: var(--turf); height: 10px; }
.limit .track i { background: var(--yellow); }
.limit .track.over i { background: var(--red); }
.limit p { margin: 8px 0 0; font-size: .85rem; color: var(--chalk-dim); }
h2.section { margin: 26px 0 10px; font: 700 1.35rem/1.2 var(--display); color: #fff; }
.bet { background: var(--turf-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.bet .top { display: flex; justify-content: space-between; gap: 10px; }
.bet .name { font-weight: 600; overflow-wrap: anywhere; }
.bet .sub { color: var(--chalk-dim); font-size: .88rem; overflow-wrap: anywhere; }
.bet .res { font: 700 1.2rem/1 var(--display); white-space: nowrap; }
.bet .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn.win { background: var(--green); color: var(--ink); }
.btn.lose { background: var(--red); color: #fff; }
.btn.void, .btn.del { background: transparent; border: 1.5px solid var(--chalk-dim); color: var(--chalk); }
.settings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.settings input { width: 120px; min-height: 38px; padding: 8px 10px; border-radius: 8px; border: 1px solid #b9c8bf; background: #fff; color: var(--ink); }
.settings .btn { background: var(--chalk); color: var(--ink); }

/* ---- barre du haut ---- */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--turf-2); border-bottom: 1px solid var(--turf-3); padding-top: env(safe-area-inset-top); }
.topbar .in { max-width: 1080px; margin: 0 auto; padding: 0 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 700 1.5rem/1 var(--display); color: #fff; padding: 12px 0; }
.brand .mark svg { display: block; }
.topbar nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.topbar nav button { background: transparent; border: 0; padding: 14px 14px 11px; color: var(--chalk-dim); font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; }
.topbar nav button:hover { color: #fff; }
.topbar nav button[aria-current="page"] { color: #fff; border-bottom-color: var(--yellow); }
.pagehead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.pagehead h1 { margin: 0; font: 700 1.9rem/1.1 var(--display); color: #fff; }
.pagehead .date { margin: 0; color: var(--chalk-dim); }
#date::first-letter { text-transform: uppercase; }
.cols { display: grid; grid-template-columns: 1fr; gap: 0 20px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .cols.three { grid-template-columns: 1fr 1fr 1fr; } }
.panel { background: var(--turf-2); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.panel h2 { margin: 0 0 10px; font: 700 1.2rem/1.2 var(--display); color: #fff; }
.panel .autobox { margin-bottom: 10px; }
.panel .wallet b { min-width: 110px; }
.livecard { background: var(--turf-2); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
.livecard .lt { display: flex; justify-content: space-between; color: var(--chalk-dim); font-size: .88rem; }
.livecard .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 8px 0; }
.livecard .teams span { font-weight: 600; overflow-wrap: anywhere; }
.livecard .teams span:last-child { text-align: right; }
.livecard .score { font: 700 2.3rem/1 var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.livecard .dot { color: #ff5a5f; font-weight: 700; }
.livecard .mine { color: var(--chalk); font-size: .9rem; }
.badge { margin: 6px 0; padding: 8px 12px; border-radius: 10px; font-weight: 700; background: var(--turf-3); color: #fff; }
.badge.winning, .badge.won { background: #1f7a4d; }
.badge.losing, .badge.lost { background: #a32a2d; }
.badge.draw { background: #8a6d00; }
.badge.none { background: var(--turf-3); color: var(--chalk-dim); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--turf-3); white-space: nowrap; }
th { color: var(--chalk-dim); font-weight: 600; font-size: .82rem; }
.edit { display: none; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.edit.open { display: flex; }
.edit select { min-height: 38px; border-radius: 8px; border: 1px solid #b9c8bf; padding: 0 8px; }
.edit input { width: 90px; min-height: 38px; border-radius: 8px; border: 1px solid #b9c8bf; padding: 0 8px; }
.edit label { font-size: .88rem; color: var(--chalk-dim); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .92rem;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); z-index: 10;
}
.toast.err { background: var(--red); }
[hidden] { display: none !important; }
@media (max-width: 380px) { .ticket { grid-template-columns: 1fr 96px; } .odds { font-size: 2.3rem; } }
@media (max-width: 600px) { .brand { width: 100%; padding: 10px 0 0; } .topbar .in { gap: 0; } .topbar nav { width: 100%; flex: none; } .topbar nav button { padding: 10px 12px 9px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.autobox { display:flex; align-items:center; gap:10px; margin:0 0 14px; color:#fff; font-size:.95rem; }
.autobox select { min-height:34px; border-radius:8px; padding:0 6px; background:#fff; color:var(--ink); }
.autobox input { width:22px; height:22px; accent-color:#ffd23f; }
.offers { margin:10px 0 0; font-size:.82rem; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.offers a { text-decoration:none; color:inherit; padding:2px 8px; border:1px solid #c5d3cb; border-radius:99px; }
.offers a.mine { background:#ffd23f; border-color:#ffd23f; font-weight:700; }
.betlink { display:inline-block; margin-top:10px; text-decoration:none; background:#0d2b22; color:#fff; padding:9px 14px; border-radius:10px; font-weight:700; }
.offers span { padding:2px 8px; border:1px solid #c5d3cb; border-radius:99px; }
.offers span.mine { background:#ffd23f; border-color:#ffd23f; color:var(--ink); font-weight:700; }
.betform select { min-height:36px; border-radius:8px; border:1px solid #b9c8bf; padding:0 8px; background:#fff; color:var(--ink); }
.wallet { display:flex; align-items:center; gap:8px; margin:8px 0; color:#fff; flex-wrap:wrap; }
.wallet b { min-width:92px; }
.wallet input, .wallet select { min-height:38px; border-radius:8px; border:1px solid #b9c8bf; padding:0 8px; background:#fff; color:var(--ink); }
.wallet input { width:110px; }
.copy { margin-top:10px; }
.analyse { margin:8px 0 4px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid #d5e0da; }
.analyse h3 { margin:0 0 8px; font:700 1rem var(--display); }
.analyse p { margin:0 0 9px; line-height:1.45; font-size:.93rem; color:var(--ink); }
.analyse p:last-child { margin-bottom:0; }

/* ---- poste de commande : l'analyse du jour, en haut d'Aujourd'hui ---- */
.cmd { position: relative; margin: 0 0 20px; background: var(--turf-2); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
.cmd .main { display: flex; align-items: center; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; padding: 18px 18px 16px; }
.cmd .state { display: flex; gap: 12px; align-items: flex-start; flex: 1 1 280px; min-width: 0; }
.cmd .dot { flex: none; width: 12px; height: 12px; margin-top: 8px; border-radius: 50%; background: var(--chalk-dim); }
.cmd .dot.run { background: var(--yellow); animation: pulse 1.6s ease-in-out infinite; }
.cmd .dot.ok { background: var(--green); }
.cmd .dot.err { background: var(--red); }
.cmd h2 { margin: 0; font: 700 1.35rem/1.2 var(--display); color: #fff; }
.cmd .sub { margin: 4px 0 0; font-size: .92rem; color: var(--chalk-dim); max-width: 56ch; }
.cmd .sub.err { color: #ff9a9c; }
.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; flex: none; min-height: 50px; padding: 0 24px;
  border: 0; border-radius: 12px; background: var(--yellow); color: var(--ink); font: 700 1.02rem var(--text); white-space: nowrap;
  box-shadow: 0 2px 0 rgba(0,0,0,.28), 0 10px 20px rgba(0,0,0,.22); transition: transform .12s, background .12s;
}
.cta:hover { background: #ffdc66; }
.cta:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.cta .ico, .cta svg { display: block; width: 20px; height: 20px; flex: none; }
.cta.ghost { background: transparent; color: var(--chalk); border: 1.5px solid var(--chalk-dim); box-shadow: none; }
.cta.ghost:hover { background: var(--turf-3); color: #fff; }
.cta:disabled { opacity: .65; cursor: default; }
.cta .spin { animation: spin 1s linear infinite; }
.cmd .bar { height: 3px; background: var(--turf-3); overflow: hidden; }
.cmd .bar i { display: block; width: 35%; height: 100%; background: var(--yellow); animation: slide 1.8s ease-in-out infinite; }
.cmd .more { padding: 0 18px 14px 42px; }
.cmd .more summary { display: inline-block; padding: 2px 0; color: var(--chalk-dim); font-size: .85rem; font-weight: 600; }
.cmd .more summary:hover { color: #fff; }
.cmd .more p { margin: 6px 0 10px; font-size: .85rem; color: var(--chalk-dim); max-width: 56ch; }
.btn.copy { white-space: normal; text-align: left; }
.rail { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--turf-3); }
.rail li + li { border-left: 1px solid var(--turf-3); }
.rail button { display: flex; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 12px 14px; text-align: left; background: transparent; border: 0; color: var(--chalk-dim); }
.rail button:hover { background: var(--turf-3); }
.rail .n { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid currentColor; font: 700 .9rem/1 var(--display); }
.rail .n svg { width: 15px; height: 15px; }
.rail li.done .n { background: var(--green); border-color: var(--green); color: var(--ink); }
.rail li.now { color: #fff; }
.rail li.now .n { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.rail li.skip { opacity: .6; }
.rail b { display: block; font-size: .95rem; line-height: 1.2; color: inherit; }
.rail small { display: block; margin-top: 1px; font-size: .8rem; line-height: 1.25; color: var(--chalk-dim); }
.tech { margin: 20px 0 0; }
.tech summary { color: var(--chalk-dim); font-size: .85rem; }
.tech ul { margin: 6px 0 0; padding-left: 18px; color: var(--chalk-dim); font-size: .85rem; }

<script>
const SPORT = { football: '⚽', basketball: '🏀', tennis: '🎾' };
/* Petit ballon devant chaque match : le sport enregistré, ou deviné d'après le championnat pour les anciennes données. */
function sportOf(x) {
  if (x.sport && SPORT[x.sport]) return x.sport;
  const t = `${x.league || ''} ${x.league_key || ''}`.toLowerCase();
  return /basket|nba|euroleague|wnba|ncaab/.test(t) ? 'basketball' : /tennis|atp|wta|itf|challenger/.test(t) ? 'tennis' : 'football';
}
const ball = x => SPORT[sportOf(x)] + ' ';
const state = { today: null, tomorrow: null, stats: null, bets: [], settings: null, busy: false, loadedFor: null,
  matches: null, slip: { legs: [], mode: 'combo', book: '', stake: '', total: null, filter: 'all', confirmRefresh: false, refreshing: false, manualEl: null } };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
}
const bookName = k => ((state.stats && state.stats.books.find(x => x.key === k)) || {}).name || k;
const safeUrl = u => { try { return new URL(u).protocol === 'https:' ? u : null; } catch (_) { return null; } };
const eur = n => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
const signedEur = n => (n > 0 ? '+' : n < 0 ? '−' : '') + eur(Math.abs(n));
const pct = (x, d = 0) => (x * 100).toFixed(d).replace('.', ',') + ' %';
const odds = x => x.toFixed(2).replace('.', ',');

async function api(path, method = 'GET', body) {
  const r = await fetch('api/' + path, {
    method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Une erreur est survenue.'), { status: r.status, data: j });
  return j;
}

let toastTimer;
function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
}

/* ---------------- Aujourd'hui ---------------- */
function shareText(s) {
  const cl = s.claude || {};
  const sport = SPORT[s.sport] || '';
  const lines = [`${sport} ${s.league} – ${s.pick_label}`, `${s.match} (${fmtDay(new Date(s.kickoff).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }))} à ${s.kickoff_local})`,
    `Cote ${odds(s.odds)} (${s.bookmaker}) – ${pct(s.prob)} de chances estimées`];
  if (cl.resume) lines.push('', `Claude : ${cl.resume}`);
  if (cl.analyse) lines.push('', cl.analyse);
  if (cl.sources && cl.sources.length) lines.push('', 'Sources : ' + cl.sources.join(' '));
  lines.push('', 'Aucun pari n\'est sûr : ne mise que ce que tu peux perdre. Aide : Joueurs Info Service 09 74 75 13 13.', '— Tessbet');
  return lines.join('\n');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.append(t); t.focus(); t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  t.remove();
  return ok;
}

function ticket(s) {
  const bank = state.stats ? state.stats.bankroll : 0;
  const suggested = Math.max(0.5, Math.round(bank * s.stake_pct * 2) / 2);
  const conf = { 'Élevée': 'high', 'Bonne': 'good', 'Moyenne': 'mid' }[s.confidence] || 'mid';

  const baseOf = k => k.replace(/_fr$/, '');
  const offerOf = bk => (s.offers || []).find(o => baseOf(o.key) === bk.key);
  const mine = books.filter(bk => ['winamax', 'unibet'].includes(bk.key) && offerOf(bk));
  const bestMine = mine.sort((x, y) => offerOf(y).odds - offerOf(x).odds)[0];
  const bookSel = el('select', { id: 'book-' + s.id, 'aria-label': 'Bookmaker' },

  const oddsInput = el('input', { type: 'number', min: '1.01', step: '0.01', value: String((bestMine ? offerOf(bestMine).odds : s.odds)), id: 'odds-' + s.id, inputmode: 'decimal' });
  if (bestMine) bookSel.value = bestMine.key;
  bookSel.addEventListener('change', () => {

  const form = el('div', { class: 'betform' },

    el('label', { for: 'odds-' + s.id, text: 'Cote' }), oddsInput,

  const offerChips = (s.offers || []).length ? el('p', { class: 'offers' }, 'Cotes : ',
    (s.offers || []).slice(0, 6).map(o => el('span', { class: ['winamax', 'unibet'].includes(baseOf(o.key)) ? 'mine' : '', text: `${o.book} ${odds(o.odds)}` }))) : null;

  const marks = [25, 50, 75].map(m => el('b', { style: `left:${m}%` }));
  const cl = s.claude;
  const claudeBox = el('div', { class: 'claude ' + (cl ? cl.verdict : 'none') },
    el('strong', { text: !cl ? 'Non vérifié par Claude' : cl.verdict === 'confirme' ? 'Claude confirme' : 'Claude conseille la prudence' }),

  const details = [...s.reasons, ...(cl ? cl.points : [])].map(r => el('li', { text: r }));
  if (cl && cl.sources.length) {
    const links = [];
    cl.sources.forEach((u, i) => {
      if (i) links.push(', ');

    });
    details.push(el('li', {}, 'Sources : ', links));
  }
  const analyse = cl && cl.analyse ? el('details', {}, el('summary', { text: 'Lire l\'analyse complète de Claude' }),
    el('div', { class: 'analyse' }, cl.analyse.split(/\n\s*\n/).map(p => el('p', { text: p.trim() })))) : null;
  const value = s.tier === 'value';
  return el('article', { class: 'ticket' + (value ? ' value' : '') },
    el('div', { class: 'body' },
      value ? el('div', { class: 'vbanner' }, el('b', { text: '💡 Bonne affaire' }), ` – plus risqué : ${pct(s.prob)} de chances. La cote vaut plus que le risque, mais tu perdras plus souvent : petite mise.`) : null,
      el('div', { class: 'meta' }, el('span', { text: `${SPORT[s.sport] || ''} ${s.league}` }), el('span', { text: s.kickoff_local })),
      el('h2', { class: 'pick', text: s.pick_label }),
      el('p', { class: 'match', text: s.match }),
      el('div', { class: 'proba' },
        el('div', { class: 'row' }, el('span', { text: 'Chances estimées' }), el('strong', { text: pct(s.prob) })),
        el('div', { class: 'track' }, el('i', { style: `width:${Math.round(s.prob * 100)}%` }), marks)),
      el('div', { class: 'chips' },

        value ? el('span', { class: 'chip deal', text: 'Pari risqué' }) : s.kind === 'valeur' ? el('span', { class: 'chip deal', text: 'Bonne affaire' }) : el('span', { class: 'chip fav', text: 'Favori solide' })),
      offerChips,

async function saveBet(s, stakeValue, oddsValue, book, force) {
  if (!book) { toast('Choisis chez quel site tu as parié.', true); return; }
  try {
    await api('bets', 'POST', { match: s.match, pick: s.pick_label, odds: Number(oddsValue) || s.odds, stake: Number(stakeValue), sport: s.sport, book, force, league_key: s.league_key, pick_team: s.pick_team, kickoff: s.kickoff });
    toast('Pari enregistré dans « Mes mises ».');
    await loadStats(); renderTrack();
  } catch (e) {
    if (e.status === 409 && confirm(e.message + '\n\nEnregistrer quand même ?')) return saveBet(s, stakeValue, oddsValue, book, true);
    if (e.status !== 409) toast(e.message, true);
  }
}

const parisToday = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dayDate = day => day === 'tomorrow' ? addDays(parisToday(), 1) : parisToday();
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const horizon = () => (state.settings && state.settings.horizon === 48) ? 48 : 24;   // 24 h = aujourd'hui, 48 h = aujourd'hui + demain
const activeDays = () => horizon() === 48 ? ['today', 'tomorrow'] : ['today'];
const betDate = b => b.kickoff ? new Date(b.kickoff).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }) : b.date;
const ICONS = {
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9"/><path d="m8 10.5 2 2 3.5-4"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  spin: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
function icon(name) { const n = document.createElement('span'); n.className = 'ico'; n.innerHTML = ICONS[name]; return n; }
function hhmm(iso) { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);

/* Où en est un jour : à lancer (todo), Claude travaille (waiting) ou terminé (done). */
function dayInfo(day) {
  const d = state[day] || {}, date = dayDate(day);
  const fresh = !!d.generated_at && d.date === date;  // une analyse d'un autre jour ne compte pas
  const kind = !fresh ? 'todo' : d.waiting ? 'waiting' : 'done';
  const fire = (fresh && d.fire) || {};
  const since = kind === 'waiting' ? (fire.fired_at || d.generated_at) : null;
  return { day, date, d, fresh, kind, fire, waitMin: since ? (Date.now() - new Date(since).getTime()) / 60000 : 0,
    picks: fresh ? (d.selections || []).length : 0 };
}

/* Vue d'ensemble sur la période choisie (24 h = aujourd'hui, 48 h = aujourd'hui + demain). */
function overview() {
  const st = state.settings || { source: 'api' }, infos = activeDays().map(dayInfo);
  const kind = infos.some(i => i.kind === 'waiting') ? 'waiting' : infos.every(i => i.kind === 'done') ? 'done' : 'todo';
  return { infos, kind, h: horizon(), source: st.source, routine: st.routine !== false, picks: infos.reduce((n, i) => n + i.picks, 0) };
}
const failed = i => i.kind === 'waiting' && ['error', 'manual'].includes(i.fire.status);
/* Jours à (re)lancer : tout si tout est fait (actualiser), sinon ceux qui ne sont pas terminés. */
const launchTargets = o => o.kind === 'done' ? o.infos : o.infos.filter(i => i.kind !== 'done');

function cmdTexts(o) {
  const claude = o.source === 'claude_task', two = o.h === 48;
  if (o.kind === 'waiting') {
    const w = o.infos.filter(i => i.kind === 'waiting'), bad = w.find(failed);
    if (bad && bad.fire.status === 'error') return { dot: 'err', title: 'Claude n\'a pas pu être réveillé', err: true, sub: bad.fire.error + '. Réessaie : rien n\'a été perdu.' };
    if (bad || !o.routine) return { dot: 'err', title: 'Réveil de Claude non réglé', err: true, sub: 'Colle le jeton de la tâche Claude dans la configuration de l\'application (Paramètres > Applications > Tessbet).' };
    const t0 = w.map(i => i.fire.fired_at).filter(Boolean).sort()[0];
    return { dot: 'run', title: 'Claude fait ses recherches',
      sub: 'Lancé' + (t0 ? ' à ' + hhmm(t0) : '') + (two && w.length > 1 ? ' pour aujourd\'hui et demain' : '') + '. Compte 10 à 20 minutes : le résultat s\'affiche ici tout seul.' };
  }
  if (o.kind === 'done') {
    const when = hhmm(o.infos.map(i => i.d.generated_at).sort().pop());
    const n = o.infos.map(i => i.d.matches_analysed || 0);
    return { dot: 'ok', title: 'Analyse terminée', sub: two
      ? 'Faite à ' + when + ' · ' + plural(n[0], 'match aujourd\'hui', 'matchs aujourd\'hui') + ', ' + n[1] + ' demain.'
      : 'Faite à ' + when + ' · ' + plural(n[0], 'match analysé', 'matchs analysés') + ' · passe en 48 h pour voir aussi demain.' };
  }
  if (two && o.infos[0].kind === 'done') return { dot: 'idle', title: 'Demain reste à analyser', sub: 'Aujourd\'hui est fait. Lance l\'analyse pour ajouter les matchs de demain.' };
  const cost = claude ? ', vérifiés par Claude sans frais d\'API.' : two ? ' (utilise des crédits de l\'API, deux fois plus pour deux jours).' : ' (utilise des crédits de l\'API).';
  return { dot: 'idle', title: two ? 'Analyse sur 48 h' : 'Analyse du jour',
    sub: 'Pas encore lancée. Elle couvre les matchs d\'aujourd\'hui' + (two ? ' et de demain, jusqu\'à minuit demain soir' : ', jusqu\'à minuit') + cost };
}

function cmdAction(o) {
  const claude = o.source === 'claude_task', run = () => launch(claude ? 'claude_task' : 'api');
  const api = claude ? '' : ' (API, crédits)';
  if (o.kind === 'done') return { label: claude ? 'Actualiser l\'analyse' : 'Actualiser' + api, ico: 'refresh', ghost: true, run };
  if (o.kind === 'waiting') {
    const w = o.infos.filter(i => i.kind === 'waiting');
    if (w.some(failed)) return { label: 'Réessayer', ico: 'refresh', ghost: false, run };
    if (o.infos.some(i => i.kind === 'todo')) return { label: 'Lancer l\'analyse', ico: 'scan', ghost: false, run };
    return w.some(i => i.waitMin >= 20) ? { label: 'Relancer Claude', ico: 'refresh', ghost: false, run }
      : { label: 'Revérifier la réponse', ico: 'refresh', ghost: true, run };
  }
  const tomorrowOnly = o.h === 48 && o.infos[0].kind === 'done';
  return { label: (tomorrowOnly ? 'Analyser demain' : 'Lancer l\'analyse') + api, ico: 'scan', ghost: false, run };
}

/* La journée en trois temps : analyser, enregistrer ses paris, les suivre en direct. */
function railSteps(o) {
  const dates = o.infos.map(i => i.date);
  const mine = state.bets.filter(b => dates.includes(betDate(b))).length;
  const pending = state.bets.filter(b => b.result === 'pending').length;
  const live = pending ? plural(pending, 'pari en cours', 'paris en cours') : 'Aucun pari en cours';
  const s1 = o.kind === 'done' ? { st: 'done', sub: o.picks ? plural(o.picks, 'pari retenu', 'paris retenus') : 'Aucun pari solide' }
    : o.kind === 'waiting' ? { st: 'now', sub: o.infos.some(failed) ? 'Réveil à relancer' : 'Claude travaille' }
    : { st: 'now', sub: o.infos.some(i => i.kind === 'done') ? 'Demain à lancer' : 'À lancer' };
  let s2, s3;
  if (o.picks) {
    s2 = mine ? { st: 'done', sub: plural(mine, 'pari enregistré', 'paris enregistrés') } : { st: o.kind === 'done' ? 'now' : 'todo', sub: 'À enregistrer ci-dessous' };
    s3 = { st: mine && o.kind === 'done' ? 'now' : 'todo', sub: live };
  } else if (o.kind === 'done') { s2 = { st: 'skip', sub: 'Rien à enregistrer' }; s3 = { st: 'skip', sub: live }; }
  else { s2 = { st: 'todo', sub: 'Après l\'analyse' }; s3 = { st: 'todo', sub: live }; }
  return [
    { n: 1, label: 'Analyse', tab: 'today', ...s1 },
    { n: 2, label: 'Mes paris', tab: 'track', ...s2 },
    { n: 3, label: 'En direct', tab: 'live', ...s3 }];
}

async function setHorizon(h) {
  if (h === horizon() || state.busy) return;
  const prev = horizon();
  state.settings = Object.assign({ source: 'api' }, state.settings, { horizon: h });
  renderToday(); watchWaiting();
  try { await api('settings', 'POST', { horizon: h }); }
  catch (e) { state.settings.horizon = prev; renderToday(); toast(e.message, true); }
}
function horizonRow() {
  const seg = (h, label, hint) => el('button', { class: 'seg' + (h === horizon() ? ' on' : ''), type: 'button', 'aria-pressed': String(h === horizon()),
    disabled: state.busy, onclick: () => setHorizon(h) }, el('b', { text: label }), el('small', { text: hint }));
  return el('div', { class: 'horizon', role: 'group', 'aria-label': 'Période analysée' },
    el('span', { class: 'hlabel', text: 'Période analysée' }),
    el('div', { class: 'segs' }, seg(24, '24 h', 'aujourd\'hui'), seg(48, '48 h', 'aujourd\'hui + demain')));
}

  if (o.source === 'claude_task' && o.kind === 'waiting') {  // la voie payante reste possible, mais discrète

    el('li', { class: s.st }, el('button', { type: 'button', 'aria-current': s.st === 'now' ? 'step' : null,

      el('span', {}, el('b', { text: s.label }), el('small', { text: s.sub })))))));
}

/* « Pourquoi aucun pari ? » : les matchs les plus proches d'être retenus et ce qui les a bloqués. */
function whyBox(d) {
  const near = d.near || [], dropped = d.claude_dropped_items || [];
  if (!near.length && !dropped.length) return null;
  const items = [
    ...dropped.map(x => el('li', {}, ball(x), el('b', { text: x.match }), ' – ' + x.pick_label, el('small', { text: 'Écarté par Claude : ' + x.resume }))),
    ...near.map(x => el('li', {}, ball(x), el('b', { text: x.match }), ` – ${x.pick_label} (cote ${odds(x.odds)}, ${x.kickoff_local})`,
      el('small', { text: 'Trop juste : ' + x.reasons.join(' ; ') + '.' })))];
  return el('details', { class: 'why' }, el('summary', { text: 'Pourquoi aucun pari ?' }),
    el('ul', {}, items),
    el('p', { text: (dropped.length ? 'Claude a écarté ' + plural(dropped.length, 'pari', 'paris') + ' après vérification. ' : '')
      + (near.length ? 'Voici aussi les matchs les plus proches des critères, sur ' + plural(d.matches_analysed || 0, 'match analysé', 'matchs analysés') + '.' : '') }));
}

/* Les paris d'un jour : tickets, ou message qui dit quoi faire. */
function daySection(i, multi) {
  const d = i.d, today = i.day === 'today', word = today ? 'aujourd\'hui' : 'demain';
  const sec = el('section', { class: 'daysec' });
  if (multi) sec.append(el('h2', { class: 'dayhead' }, today ? 'Aujourd\'hui' : 'Demain', el('span', { text: fmtDay(i.date) }),
    i.kind === 'done' ? el('em', { text: i.picks ? plural(i.picks, 'pari', 'paris') : 'aucun pari' }) : null));
  if (i.kind === 'done' && i.picks) sec.append(el('p', { class: 'summary', text: d.message || '' }));
  const box = el('div', { class: 'cols' });
  if (i.kind === 'todo') {
    const last = today && d.generated_at && d.date !== i.date ? fmtDay(d.date) : null;
    box.append(el('div', { class: 'empty' }, el('h2', { text: 'Pas encore d\'analyse pour ' + word }),
      el('p', { text: 'Appuie sur le bouton jaune : Tessbet cherche les paris solides parmi les matchs ' + (today ? 'd\'aujourd\'hui' : 'de demain') + '.'
        + (last ? ' La dernière date de ' + last + ' : tu la retrouves dans « Passés ».' : '') })));
  } else if (i.kind === 'waiting') {
    box.append(el('div', { class: 'empty' }, el('h2', { text: today ? 'Les paris arrivent' : 'Les paris de demain arrivent' }),
      el('p', { text: 'Tu n\'as rien à faire : dès que Claude a fini ses vérifications, les paris retenus s\'affichent ici.' })));
  } else if (!i.picks) {
    box.append(el('div', { class: 'empty' }, el('h2', { text: 'Pas de pari ' + word }),
      el('p', { text: (d.message || 'Aucun match ne remplit les critères de solidité.') + (today ? ' Repasse demain.' : '') }), whyBox(d)));
  } else {
    d.selections.forEach(s => box.append(ticket(s)));
  }
  sec.append(box);
  return sec;
}

/* Le résumé en haut d'Aujourd'hui : mon argent, ma plus-value, ce qui est en jeu, ce qui se joue maintenant. */
function renderRecap() {
  const box = document.getElementById('recap'), s = state.stats;
  if (!box) return;
  box.replaceChildren();
  if (!s) return;
  const pend = state.bets.filter(b => b.result === 'pending');
  const pot = pend.reduce((t, b) => t + gainOf(b), 0);
  const items = pend.flatMap(b => b.legs && b.legs.length ? b.legs : [b]);
  const live = items.filter(x => x.live && x.live.state === 'in').length;
  const tile = (label, value, sub, tab, cls = '') => el('button', { class: 'rtile ' + cls, type: 'button', onclick: () => showTab(tab) },
    el('span', { class: 'rl', text: label }), el('strong', { text: value }), el('small', { text: sub }));
  const base = s.invested || s.bankroll_start;
  const roi = base ? s.profit / base : 0;
  box.append(
    tile('Mon argent', eur(s.bankroll), (s.by_book || []).filter(x => x.n).map(x => `${x.name} ${eur(x.balance + x.pending)}`).join(' · ') || 'Aucun site', 'track'),
    tile('Plus-value depuis le début', signedEur(s.profit), `${roi >= 0 ? '+' : '−'}${pct(Math.abs(roi), 1)} sur ${eur(base)} apportés`, 'track', s.profit > 0 ? 'up' : s.profit < 0 ? 'down' : ''),
    tile('En jeu', eur(s.pending), pend.length ? `${plural(pend.length, 'pari', 'paris')} · gain potentiel +${eur(pot)}` : 'Aucun pari en cours', 'track'),
    tile('En direct', live ? plural(live, 'match', 'matchs') : '–', live ? 'en cours maintenant' : items.length ? plural(items.length, 'match à venir', 'matchs à venir') : 'Rien à suivre', 'live', live ? 'live' : ''));
}

/* Partager les pronos du jour (et les moins sûrs) sur le groupe Telegram des potes. */
function renderShare() {
  const box = document.getElementById('sharebar'); if (!box) return;
  const done = activeDays().some(day => state[day] && state[day].generated_at && !state[day].waiting && state[day].date === dayDate(day));
  box.replaceChildren();
  if (!done) return;
  const btn = el('button', { class: 'cta ghost tg', type: 'button' }, '📣 Envoyer les pronos sur Telegram');
  btn.addEventListener('click', async () => {
    if (!confirm('Envoyer les pronos du jour (et les moins sûrs) sur ton groupe Telegram ?')) return;
    btn.disabled = true;
    try { const r = await api('telegram/share', 'POST', {}); toast('Envoyé sur Telegram' + (r.chat ? ' (' + r.chat + ')' : '') + '.'); }
    catch (e) { toast(e.message, true); }
    btn.disabled = false;
  });
  box.append(btn);
}

function renderToday() {
  const d = state.today;
  if (!d) return;
  renderRecap();
  renderShare();
  const o = overview();
  document.getElementById('date').textContent = fmtDay(parisToday());
  document.getElementById('demo-banner').hidden = d.mode !== 'demo';
  document.getElementById('summary').textContent = '';
  document.getElementById('tickets').replaceChildren(...o.infos.map(i => daySection(i, o.h === 48)));
  renderCmd();
  const w = o.infos.flatMap(i => i.fresh ? (i.d.warnings || []).map(x => (o.h === 48 && i.day === 'tomorrow' ? 'Demain : ' : '') + x) : []);
  document.getElementById('tech').hidden = !w.length;
  document.getElementById('techsum').textContent = 'Infos techniques (' + w.length + ')';
  document.getElementById('warnings').replaceChildren(...w.map(x => el('li', { text: x })));
  document.getElementById('disclaimer').textContent = d.disclaimer || '';
}

/* ---------------- Mes mises ---------------- */
const liveSuffix = x => x.live ? (x.live.state === 'in' ? ` – 🔴 en direct ${x.live.score[0]}-${x.live.score[1]} (${x.live.clock})` : x.live.state === 'post' ? ` – terminé ${x.live.score[0]}-${x.live.score[1]}` : '') : '';
const gainOf = b => b.win_profit != null ? b.win_profit : b.stake * ((b.eff_odds || b.odds) - 1) * (1 + (b.boost || 0) / 100);
const boostTxt = b => b.boost ? ` – boost +${String(b.boost).replace('.', ',')} %` : '';
const reloadBets = async () => { await loadStats(); await loadBets(); renderTrack(); };

/* Les matchs d'un combiné : chacun se valide séparément, le combiné s'en déduit. */
function comboLegs(b) {
  const setLeg = (i, r) => async () => { try { await api(`bets/${b.id}/legs/${i}`, 'POST', { result: r }); await reloadBets(); } catch (e) { toast(e.message, true); } };
  const names = { win: 'Gagné', lose: 'Perdu', void: 'Annulé' };
  return el('ul', { class: 'legs' }, b.legs.map((l, i) => {
    const r = l.result || 'pending', code = l.status && l.status.code;
    const hint = r === 'pending' && (code === 'won' || code === 'lost') ? (code === 'won' ? 'win' : 'lose') : null;
    return el('li', {},
      el('div', { class: 'lg' }, el('b', { text: ball(l) + l.pick }), el('small', { text: `${l.match} – cote ${odds(l.odds)}` + liveSuffix(l) })),
      r === 'pending'
        ? el('span', { class: 'lgb' }, [['win', '✓'], ['lose', '✗'], ['void', '○']].map(([k, sym]) =>
            el('button', { class: 'mini ' + k + (hint === k ? ' hint' : ''), type: 'button', title: names[k], 'aria-label': `${names[k]} : ${l.pick}`, text: sym, onclick: setLeg(i, k) })))
        : el('span', { class: 'lgb' }, el('span', { class: 'rchip ' + r, text: names[r] }),
            el('button', { class: 'mini', type: 'button', title: 'Remettre en cours', 'aria-label': 'Remettre en cours : ' + l.pick, text: '↺', onclick: setLeg(i, 'pending') })));
  }));
}

function betRow(b) {
  const combo = !!(b.legs && b.legs.length);
  const eff = b.eff_odds || b.odds;
  const profit = b.result === 'win' ? gainOf(b) : b.result === 'lose' ? -b.stake : 0;
  const label = { win: 'Gagné', lose: 'Perdu', void: 'Annulé', pending: 'En cours' }[b.result];
  const res = el('span', { class: 'res ' + (profit > 0 ? 'pos' : profit < 0 ? 'neg' : ''), text: b.result === 'pending' ? 'En cours' : `${label} ${profit ? signedEur(profit) : ''}`.trim() });
  const potential = b.result === 'pending' ? el('div', { class: 'gainp' }, 'Gain potentiel ', el('b', { text: '+' + eur(gainOf(b)) }), ` (retour ${eur(b.stake + gainOf(b))})`) : null;
  const setRes = r => async () => { try { await api(`bets/${b.id}/result`, 'POST', { result: r }); await reloadBets(); } catch (e) { toast(e.message, true); } };
  const btns = el('div', { class: 'btns' });
  if (b.result === 'pending') {
    btns.append(el('button', { class: 'btn small win', type: 'button', text: combo ? 'Combiné gagné' : 'Gagné', onclick: setRes('win') }),
      el('button', { class: 'btn small lose', type: 'button', text: combo ? 'Combiné perdu' : 'Perdu', onclick: setRes('lose') }),
      el('button', { class: 'btn small void', type: 'button', text: 'Annulé', onclick: setRes('void') }));
  } else {
    btns.append(el('button', { class: 'btn small void', type: 'button', text: 'Remettre en cours', onclick: setRes('pending') }));
  }
  const eo = el('input', { type: 'number', min: '1.01', step: '0.01', value: String(b.odds), inputmode: 'decimal', 'aria-label': 'Cote' });
  const es = el('input', { type: 'number', min: '0.5', step: '0.5', value: String(b.stake), inputmode: 'decimal', 'aria-label': 'Mise' });
  const eb = el('select', { 'aria-label': 'Site' }, el('option', { value: '', text: 'Non précisé' }), state.stats.books.map(bk => el('option', { value: bk.key, text: bk.name })));
  eb.value = b.book || '';
  const ebo = el('input', { type: 'text', inputmode: 'decimal', value: b.boost ? String(b.boost).replace('.', ',') : '', placeholder: '0', 'aria-label': 'Boost en %' });
  const edit = el('div', { class: 'edit' }, el('label', { text: 'Site' }), eb, el('label', { text: 'Cote' }), eo, el('label', { text: 'Mise (€)' }), es, el('label', { text: 'Boost (%)' }), ebo,
    el('button', { class: 'btn small', type: 'button', text: 'Valider', onclick: async () => {
      try { await api('bets/' + b.id, 'POST', { odds: Number(eo.value), stake: Number(es.value), book: eb.value, boost: ebo.value.trim() === '' ? 0 : num(ebo.value) }); await reloadBets(); toast('Pari modifié.'); }
      catch (e) { toast(e.message, true); }
    } }));
  btns.append(el('button', { class: 'btn small void', type: 'button', text: 'Modifier cote / mise / boost', onclick: () => edit.classList.toggle('open') }));
  btns.append(el('button', { class: 'btn small del', type: 'button', text: 'Supprimer', onclick: async () => {
    if (!confirm('Supprimer ce pari de l\'historique ?')) return;
    try { await api('bets/' + b.id, 'DELETE'); await reloadBets(); } catch (e) { toast(e.message, true); }
  } }));
  const sub = combo
    ? `Cote ${odds(b.odds)}` + (eff !== b.odds ? ` (${odds(eff)} sans le match annulé)` : '') + ` – mise ${eur(b.stake)}` + (b.book ? ' – ' + bookName(b.book) : '') + boostTxt(b)
    : `${b.match} – cote ${odds(b.odds)} – mise ${eur(b.stake)}` + (b.book ? ' – ' + bookName(b.book) : '') + boostTxt(b) + liveSuffix(b);
  return el('div', { class: 'bet' },
    el('div', { class: 'top' },
      el('div', {}, el('div', { class: 'name', text: combo ? `🎟️ Combiné de ${plural(b.legs.length, 'match', 'matchs')}` : ball(b) + b.pick }), el('div', { class: 'sub', text: sub }), potential),
      res),
    combo ? comboLegs(b) : null,
    combo && b.result === 'pending' && b.status ? el('div', { class: 'badge ' + b.status.code, text: b.status.text }) : null,
    btns, edit);
}

function evolution(s) {
  const wrap = el('div', {});
  const pts = [{ bankroll: s.bankroll_start, label: 'Départ' }, ...s.series];
  wrap.append(el('h2', { class: 'section', text: 'Évolution de mon argent' }));
  if (s.series.length) {
    const W = 600, H = 200, P = 28;
    const ys = pts.map(p => p.bankroll), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
    const X = i => P + (pts.length === 1 ? 0 : i * (W - 2 * P) / (pts.length - 1));
    const Y = v => H - P - (v - lo) / span * (H - 2 * P);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Courbe de mon argent après chaque pari terminé');
    const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text) n.textContent = text; svg.append(n); };
    add('line', { x1: P, x2: W - P, y1: Y(s.bankroll_start), y2: Y(s.bankroll_start), stroke: '#8fb0a0', 'stroke-dasharray': '4 4', 'stroke-width': 1 });
    add('polyline', { points: pts.map((p, i) => `${X(i)},${Y(p.bankroll)}`).join(' '), fill: 'none', stroke: '#ffd23f', 'stroke-width': 3, 'stroke-linejoin': 'round' });
    pts.forEach((p, i) => add('circle', { cx: X(i), cy: Y(p.bankroll), r: 4.5, fill: p.move ? '#ffd23f' : i && p.profit < 0 ? '#ff7478' : '#2fbf71' }));
    add('text', { x: P, y: 14, fill: '#cfe3d8', 'font-size': 12 }, 'Max ' + eur(hi));
    add('text', { x: P, y: H - 6, fill: '#8fb0a0', 'font-size': 12 }, 'Min ' + eur(lo));
    add('text', { x: W - P, y: 14, fill: '#fff', 'font-size': 13, 'text-anchor': 'end', 'font-weight': 700 }, 'Aujourd\'hui ' + eur(s.bankroll));
    wrap.append(el('div', { class: 'panel' }, svg, el('p', { class: 'note', text: `Départ ${eur(s.bankroll_start)} → maintenant ${eur(s.bankroll)} (${signedEur(s.profit)}). Un point = un pari terminé (jaune = retrait ou dépôt).` })));
  } else wrap.append(el('p', { class: 'note', text: 'La courbe apparaît dès ton premier pari terminé.' }));
  if (s.by_day.length) {
    wrap.append(el('h2', { class: 'section', text: 'Jour par jour' }));
    wrap.append(el('div', { class: 'panel tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ['Jour', 'Paris', 'Misé', 'Résultat'].map(t => el('th', { text: t })))),
      el('tbody', {}, s.by_day.map(x => el('tr', {}, el('td', { text: new Date(x.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) }),
        el('td', { text: String(x.n) }), el('td', { text: eur(x.staked) }), el('td', { class: x.profit > 0 ? 'pos' : x.profit < 0 ? 'neg' : '', text: signedEur(x.profit) })))))));
  }
  return wrap;
}

function renderTrack() {
  const s = state.stats; if (!s) return;
  const box = document.getElementById('track'); box.replaceChildren();
  const over = s.staked_today > s.daily_cap;
  const used = s.daily_cap ? Math.min(100, (s.staked_today / s.daily_cap) * 100) : 0;
  box.append(
    el('div', { class: 'bank', text: eur(s.bankroll) }),
    el('p', { class: 'bank-sub' }, 'Argent disponible, dont ', eur(s.pending), ' en jeu. Résultat total : ',
      el('span', { class: s.profit > 0 ? 'pos' : s.profit < 0 ? 'neg' : '', text: signedEur(s.profit) })),
    booksPanel(s),
    el('div', { class: 'grid3' },
      el('div', { class: 'cell' }, el('span', { text: 'Réussite' }), el('strong', { text: s.win_rate == null ? '–' : pct(s.win_rate) })),
      el('div', { class: 'cell' }, el('span', { text: 'Rendement' }), el('strong', { text: s.roi == null ? '–' : pct(s.roi, 1) })),
      el('div', { class: 'cell' }, el('span', { text: 'Paris terminés' }), el('strong', { text: String(s.n_settled) }))),
    el('div', { class: 'limit' },
      el('div', { class: 'row' }, el('span', { text: 'Limite du jour' }), el('span', { text: `${eur(s.staked_today)} sur ${eur(s.daily_cap)}` })),
      el('div', { class: 'track' + (over ? ' over' : '') }, el('i', { style: `width:${used}%` })),
      el('p', { text: over ? 'Limite dépassée. Arrête-toi pour aujourd\'hui.' : `Il te reste ${eur(s.daily_left)} à miser aujourd'hui. Tu peux changer la limite dans Réglages.` })),
    el('div', { class: 'sechead' }, el('h2', { class: 'section', text: 'Historique' }),
      el('button', { class: 'btn small refresh', type: 'button', text: '+ Ajouter un pari', onclick: () => showTab('bet') })));
  if (!state.bets.length) {
    box.append(el('div', { class: 'empty' }, el('h2', { text: 'Aucune mise pour l\'instant' }),
      el('p', { text: 'Quand tu paries, appuie sur « J\'ai parié » sur un ticket, ou compose ton pari (seul ou en combiné) dans l\'onglet Matchs.' })));
  } else {
    state.bets.forEach(b => box.append(betRow(b)));
  }
  box.append(evolution(s));
}

/* Le solde de chaque site, juste sous le total : leur somme fait le total. */
function booksPanel(s) {
  const rows = s.by_book.filter(x => x.n || x.balance || x.pending || x.added || x.withdrawn);
  const list = el('ul', { class: 'books' }, rows.map(x => el('li', {},
    el('span', { class: 'bn', text: x.name }),
    el('span', { class: 'bd', text: (x.pending ? `dont ${eur(x.pending)} en jeu en plus · ` : '') + 'résultat ' + signedEur(x.profit) }),
    el('b', { text: eur(x.balance + x.pending) }))));
  if (s.unplaced > 0.004) list.append(el('li', {}, el('span', { class: 'bn', text: 'Pas encore sur un site' }), el('span', { class: 'bd', text: '' }), el('b', { text: eur(s.unplaced) })));
  return el('div', { class: 'panel bookspanel' }, list, moveForm(s), movesList(s),
    el('p', { class: 'note', text: 'Solde de chaque site = ce que tu y as déposé + ce que tu y as gagné ou perdu (mises en cours comprises). Un pari sans site est compté dans « Non précisé » : modifie-le pour choisir son site.' }));
}

/* Retrait vers la banque, dépôt depuis la banque, ou transfert d'un site à l'autre. */
function moveForm(s) {
  const books = s.books || [];
  const opts = () => [el('option', { value: '', text: 'Choisis' }), ...books.map(b => el('option', { value: b.key, text: b.name }))];
  const typ = el('select', { 'aria-label': 'Type de mouvement' },
    el('option', { value: 'transfer', text: 'Transfert d\'un site à un autre' }),
    el('option', { value: 'withdraw', text: 'Retrait vers mon compte bancaire' }),
    el('option', { value: 'deposit', text: 'Dépôt depuis mon compte bancaire' }));
  const from = el('select', { 'aria-label': 'Site de départ' }, opts()), to = el('select', { 'aria-label': 'Site d\'arrivée' }, opts());
  const amount = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Montant €', 'aria-label': 'Montant en euros', autocomplete: 'off' });
  const lf = el('label', {}, 'De ', from), lt = el('label', {}, 'Vers ', to);
  const sync = () => { lf.hidden = typ.value === 'deposit'; lt.hidden = typ.value === 'withdraw'; };
  typ.addEventListener('change', sync); sync();
  const send = async force => {
    try {
      await api('moves', 'POST', { type: typ.value, from: from.value, to: to.value, amount: num(amount.value), force });
      toast({ transfer: 'Transfert enregistré.', withdraw: 'Retrait enregistré.', deposit: 'Dépôt enregistré.' }[typ.value]);
      await loadStats(); renderTrack();
    } catch (e) {
      if (e.status === 409 && confirm(e.message + '\n\nEnregistrer quand même ?')) return send(true);
      if (e.status !== 409) toast(e.message, true);
    }
  };
  const form = el('div', { class: 'moveform' }, typ, lf, lt, amount, el('button', { class: 'btn small', type: 'button', text: 'Valider', onclick: () => send(false) }));
  return el('details', { class: 'moves' }, el('summary', { text: 'Retrait, dépôt ou transfert entre sites' }), form,
    el('p', { class: 'note', text: 'Un transfert ne change pas ton argent total. Un retrait vers ta banque le diminue, un dépôt l\'augmente. Ta plus-value ne bouge pas.' }));
}

function movesList(s) {
  const ms = s.moves || [];
  if (!ms.length) return null;
  const txt = m => m.type === 'transfer' ? `${m.from_name} → ${m.to_name}` : m.type === 'withdraw' ? `Retrait ${m.from_name} → banque` : `Dépôt banque → ${m.to_name}`;
  return el('details', { class: 'moves' }, el('summary', { text: `Mouvements d'argent (${ms.length})` }),
    el('ul', { class: 'books' }, ms.map(m => el('li', {},
      el('span', { class: 'bn', text: new Date(m.created).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) }),
      el('span', { class: 'bd', text: txt(m) }),
      el('span', {}, el('b', { text: eur(m.amount) }), ' ',
        el('button', { class: 'mini', type: 'button', title: 'Supprimer', 'aria-label': 'Supprimer ce mouvement', text: '×', onclick: async () => {
          if (!confirm('Supprimer ce mouvement ?')) return;
          try { await api('moves/' + m.id, 'DELETE'); await loadStats(); renderTrack(); } catch (e) { toast(e.message, true); }

/* ---------------- En direct ---------------- */
let liveTimer = null;
/* « Aujourd'hui 21:00 », « Demain 02:10 » ou « sam. 24 oct. 21:00 » (heure de Paris). */
function whenTxt(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const day = d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });
  const t = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
  const lab = day === parisToday() ? 'Aujourd\'hui' : day === addDays(parisToday(), 1) ? 'Demain' : day === addDays(parisToday(), -1) ? 'Hier'
    : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/Paris' });
  return `${lab} à ${t}`;
}
const startOf = x => (x.live && x.live.start) || x.kickoff || '';
const badgeOf = (st, l, after = '') => st ? el('div', { class: 'badge ' + st.code, text: (st.code === 'won' ? '✅ ' : st.code === 'lost' ? '❌ ' : st.code === 'winning' ? '🟢 ' : st.code === 'losing' ? '🔴 ' : '🟡 ') + st.text + after })
  : el('div', { class: 'badge none', text: l && l.state === 'in' ? 'Statut indisponible' : 'Pas encore commencé' });

function liveCard(b) {
  if (b.legs && b.legs.length) return liveComboCard(b);
  const [home, away] = (b.match || '').split(/\s+[–-]\s+/);
  const l = b.live, st = b.status;
  const stateTxt = !l ? 'En attente du coup d\'envoi' : l.state === 'in' ? null : l.state === 'post' ? 'Terminé' : 'Pas commencé';
  const badge = badgeOf(st, l, st && (st.code === 'won' || st.code === 'lost') ? ' (match terminé)' : '');
  const confirm = (r) => async () => { try { await api(`bets/${b.id}/result`, 'POST', { result: r }); await loadStats(); await renderLive(); toast('Résultat enregistré.'); } catch (e) { toast(e.message, true); } };
  return el('div', { class: 'livecard' },
    el('div', { class: 'lt' }, el('span', { text: `${ball(b)}${whenTxt(startOf(b)) || fmtDay(b.date)}` }),
      stateTxt ? el('span', { text: stateTxt }) : el('span', { class: 'dot', text: '● EN DIRECT ' + (l.clock || '') })),
    el('div', { class: 'teams' }, el('span', { text: home || b.match }),
      el('span', { class: 'score', text: l ? `${l.score[0]} - ${l.score[1]}` : '– - –' }), el('span', { text: away || '' })),
    badge,
    el('div', { class: 'mine', text: `Mon pari : ${b.pick} – cote ${odds(b.odds)} – mise ${eur(b.stake)}` + (b.book ? ' – ' + bookName(b.book) : '') + boostTxt(b) + ` – gain possible ${eur(gainOf(b))}` }),
    b.result === 'pending' && st && (st.code === 'won' || st.code === 'lost')
      ? el('div', { class: 'btns' }, el('button', { class: 'btn small ' + (st.code === 'won' ? 'win' : 'lose'), type: 'button', text: st.code === 'won' ? 'Valider : gagné' : 'Valider : perdu', onclick: confirm(st.code === 'won' ? 'win' : 'lose') })) : null);
}

/* Un combiné : un seul bloc, le score de chacun de ses matchs. */
function liveComboCard(b) {
  const done = { win: '✅ Gagné', lose: '❌ Perdu', void: 'Annulé' };
  const setLeg = (i, r) => async () => { try { await api(`bets/${b.id}/legs/${i}`, 'POST', { result: r }); await loadStats(); await renderLive(); toast('Résultat enregistré.'); } catch (e) { toast(e.message, true); } };
  const rows = b.legs.map((l, i) => {

const baseKey = k => k.replace(/_fr$/, '');
const round2 = x => Math.round(x * 100) / 100;
const num = v => Number(String(v).replace(',', '.'));
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 2 ? 'à l\'instant' : m < 90 ? `il y a ${m} min` : m < 36 * 60 ? `il y a ${Math.round(m / 60)} h` : 'il y a plus d\'un jour'; };
const isCombo = s => s.legs.length > 1 && s.mode === 'combo';
const comboOdds = s => s.total != null ? s.total : round2(s.legs.reduce((p, l) => p * l.odds, 1));
const oddsAt = (src, book) => { const f = book && (src.offers || []).find(x => baseKey(x.key) === book); return f ? f.odds : src.best; };
async function loadMatches() { state.matches = await api('matches'); }

    s.legs.push({ key, event: m.id, match: `${m.home} – ${m.away}`, pick: o.label, pick_team: o.name === 'Draw' ? undefined : o.name,
      best: o.odds, offers: o.offers, odds: oddsAt({ offers: o.offers, best: o.odds }, s.book), sport: m.sport, league_key: m.league_key,

  const other = el('input', { type: 'text', placeholder: 'Ton pari (ex. Plus de 2,5 buts)', 'aria-label': 'Ton pari', maxlength: '80', autocomplete: 'off', hidden: true });
  const cote = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Cote (ex. 1,85)', 'aria-label': 'Cote' });

    pick.value = [...pick.options].some(o => o.value === keep) ? keep : 'home';
    other.hidden = pick.value !== 'other';

  [t1, t2].forEach(i => i.addEventListener('input', fill));
  sport.addEventListener('change', fill); pick.addEventListener('change', fill);

  const add = () => {
    const a = t1.value.trim(), b = t2.value.trim(), c = num(cote.value);

async function saveSlip(force) {
  const s = state.slip;
  if (!s.legs.length) return toast('Ajoute au moins un match au ticket.', true);
  if (!s.book) return toast('Choisis chez quel site tu as parié.', true);
  const stake = num(s.stake);
  if (!(stake > 0)) return toast('Indique ta mise.', true);
  const bst = String(s.boost || '').trim() === '' ? 0 : num(s.boost);
  if (!(bst >= 0 && bst <= 200)) return toast('Boost invalide (entre 0 et 200 %).', true);
  const leg = l => ({ match: l.match, pick: l.pick, odds: l.odds, sport: l.sport, league_key: l.league_key, pick_team: l.pick_team, kickoff: l.kickoff });
  const combo = isCombo(s);
  try {
    if (combo) await api('bets', 'POST', { legs: s.legs.map(leg), odds: comboOdds(s), stake, book: s.book, boost: bst, force });
    else for (const l of [...s.legs]) { await api('bets', 'POST', { ...leg(l), stake, book: s.book, boost: bst, force }); s.legs = s.legs.filter(x => x !== l); }
  } catch (e) {
    if (e.status === 409) { if (confirm(e.message + '\n\nEnregistrer quand même ?')) return saveSlip(true); return; }
    renderBet(); toast(e.message, true); return;
  }
  const n = s.legs.length;
  s.legs = []; s.total = null; s.stake = ''; s.boost = '';
  toast(combo ? `Combiné de ${n} matchs enregistré dans « Mes mises ».` : 'Pari enregistré dans « Mes mises ».');
  await showTab('track');
}

        st.source === 'claude_task' && st.routine ? claudeBtn : '',
        st.source === 'claude_task' && st.routine ? el('p', { class: 'note', text: 'Le test lance une très courte session Claude, sans recherche ni crédit de cotes.' }) : ''),
      el('div', { class: 'panel' }, el('h2', { text: 'Analyse' }),
        el('label', { class: 'autobox' }, auto, el('span', { text: 'Me proposer l\'analyse chaque matin, vers' }), hourSel),
        el('p', { class: 'note', text: 'À l\'heure choisie, Tessbet te demande sur l\'iPhone si tu veux lancer l\'analyse : rien ne part sans ton accord. Tu peux aussi la lancer toi-même à toute heure dans Aujourd\'hui.' })),
      el('div', { class: 'panel' }, el('h2', { text: 'Notifications' }),
        el('label', { class: 'autobox' }, live, el('span', { text: 'Buts, mi-temps et résultat de mes paris' })),
        notifBtn,
        el('p', { class: 'note', id: 'notifstatus', text: state.today && state.today.notification ? 'iPhone : ' + state.today.notification : '' })),
      tgPanel(),
      el('div', { class: 'panel' }, el('h2', { text: 'Limite de mise par jour' }),
        el('div', { class: 'settings' }, cap, '€',
          el('button', { class: 'btn small', type: 'button', text: 'Enregistrer', onclick: async () => {
            try { await api('settings', 'POST', { cap: cap.value === '' ? null : Number(cap.value) }); await loadStats(); toast(cap.value === '' ? 'Limite automatique (5 % de ton argent).' : 'Limite enregistrée : ' + eur(Number(cap.value)) + ' par jour.'); }
            catch (e) { toast(e.message, true); }
          } })),
        el('p', { class: 'note', text: 'Laisse vide pour la limite automatique (5 % de ton argent). Tessbet te prévient quand une mise la dépasse.' }))));
}

function tgPanel() {
  const panel = el('div', { class: 'panel' }, el('h2', { text: 'Telegram (partage avec les potes)' }));
  const body = el('div', {}); panel.append(body);
  const draw = async () => {
    body.replaceChildren(el('p', { class: 'note', text: 'Chargement…' }));
    let st; try { st = await api('telegram'); } catch (e) { body.replaceChildren(el('p', { class: 'note', text: e.message })); return; }
    body.replaceChildren();
    if (!st.configured) {
      body.append(el('ol', { class: 'steps' },
        el('li', { text: 'Dans Telegram, ouvre @BotFather, envoie /newbot et choisis un nom (ex. Tessbet Pronos).' }),
        el('li', { text: 'Copie le jeton qu\'il te donne et colle-le dans la configuration de l\'application Tessbet (case telegram_token), puis redémarre-la.' }),
        el('li', { text: 'Ajoute ton bot dans le groupe avec tes potes et écris-y un message.' }),
        el('li', { text: 'Reviens ici : « Chercher mon groupe ».' })));
      return;
    }
    body.append(el('p', { class: 'note', text: st.chat ? 'Groupe choisi : ' + st.chat.title : 'Aucun groupe choisi. Ajoute le bot dans ton groupe, écris-y un message, puis cherche-le ici.' }));
    const list = el('div', { class: 'btns' });
    const find = el('button', { class: 'btn small', type: 'button', text: 'Chercher mon groupe', onclick: async () => {
      try {
        const r = await api('telegram/find', 'POST', {});
        list.replaceChildren(...(r.chats.length ? r.chats.map(c => el('button', { class: 'btn small', type: 'button', text: (c.type === 'private' ? '👤 ' : '👥 ') + c.title,
          onclick: async () => { try { await api('telegram/chat', 'POST', c); toast('Groupe choisi : ' + c.title); draw(); } catch (e) { toast(e.message, true); } } }))
          : [el('p', { class: 'note', text: 'Aucun groupe trouvé : ajoute le bot au groupe, écris un message dedans, puis réessaie.' })]));
      } catch (e) { toast(e.message, true); }
    } });
    const test = st.chat ? el('button', { class: 'btn small', type: 'button', text: 'Envoyer un test', onclick: async () => {
      try { await api('telegram/share', 'POST', { test: true }); toast('Message de test envoyé.'); } catch (e) { toast(e.message, true); }
    } }) : null;
    body.append(el('div', { class: 'btns' }, find, test), list,
      el('p', { class: 'note', text: 'Le bouton « Envoyer les pronos sur Telegram » apparaît dans Aujourd\'hui dès que l\'analyse est faite.' }));
  };
  draw();
  return panel;
}

/* ---------------- chargement ---------------- */
async function loadToday() { [state.today, state.tomorrow] = await Promise.all([api('today'), api('today?day=tomorrow')]); state.loadedFor = parisToday(); }
async function loadStats() { state.stats = await api('stats'); }
async function loadBets() { state.bets = (await api('bets')).bets; }
async function loadSettings() { try { state.settings = await api('settings'); } catch (_) { state.settings = state.settings || { source: 'api' }; } }

async function launch(source) {
  if (state.busy) return;
  const o = overview(), targets = launchTargets(o);
  if (source === 'api' && !confirm('L\'analyse par l\'API coûte des crédits sur ta clé Anthropic' + (targets.length > 1 ? ' (deux jours : deux fois plus)' : '') + '. Lancer quand même ?')) return;
  state.busy = true; renderCmd();
  try {
    for (const i of targets) {  // aujourd'hui d'abord, puis demain
      state[i.day] = await api('refresh', 'POST', { force: true, source, confirm: source === 'api', day: i.day,
        refire: source === 'claude_task' && i.kind === 'waiting' && i.waitMin >= 20 });
    }
    state.busy = false; renderToday();
    const res = targets.map(i => state[i.day]), waiting = res.filter(r => r.waiting);
    const f = waiting.map(r => r.fire || {}).find(x => x.status === 'error' || x.status === 'manual');
    if (!waiting.length) toast('Analyse mise à jour.');
    else if (f && f.status === 'error') toast('Claude n\'a pas pu être réveillé : ' + f.error + '.', true);
    else if (f) toast('Réveil automatique non réglé : colle le jeton de la tâche Claude dans les réglages de l\'application.', true);
    else toast('Claude est prévenu. Le résultat arrivera ici tout seul.');
  } catch (err) { state.busy = false; renderToday(); toast(err.message, true); }
  watchWaiting();
}
let waitTimer = null;
const anyWaiting = () => activeDays().some(day => state[day] && state[day].waiting);
function watchWaiting() {
  clearInterval(waitTimer); waitTimer = null;
  if (!anyWaiting()) return;
  waitTimer = setInterval(async () => {  // pendant que Claude travaille, on regarde si la réponse est arrivée
    let changed = false;
    for (const day of activeDays()) {
      if (!(state[day] && state[day].waiting)) continue;
      try {
        const d = await api('today' + (day === 'tomorrow' ? '?day=tomorrow' : ''));
        if (d.waiting && d.date === state[day].date) continue;
        state[day] = d; changed = true;
      } catch (_) {}
    }
    renderToday();  // rafraîchit aussi le temps écoulé
    if (changed) toast('Claude a répondu : analyse mise à jour.');
    if (!anyWaiting()) { clearInterval(waitTimer); waitTimer = null; }
  }, 30000);
}

async function showTab(t) {
  document.querySelectorAll('.topbar nav button').forEach(x => x.toggleAttribute('aria-current', x.dataset.tab === t));
  document.querySelectorAll('.topbar nav button[aria-current]').forEach(x => x.setAttribute('aria-current', 'page'));
  ['today', 'bet', 'live', 'past', 'track', 'settings'].forEach(n => document.getElementById('tab-' + n).hidden = n !== t);
  clearInterval(liveTimer); liveTimer = null;
  renderSlipbar();
  try {
    if (t === 'past') renderPast((await api('history')).days);
    if (t === 'track') { await Promise.all([loadStats(), loadBets()]); renderTrack(); }
    if (t === 'settings') { await Promise.all([loadStats(), loadToday(), loadSettings()]); renderSettings(state.settings); }
    if (t === 'today') { await Promise.all([loadToday(), loadBets(), loadSettings(), loadStats()]); renderToday(); watchWaiting(); }
    if (t === 'bet') { await Promise.all([loadStats(), loadMatches(), loadSettings()]); renderBet(); }
    if (t === 'live') { await renderLive(); liveTimer = setInterval(renderLive, 20000); }
  } catch (e) { toast(e.message, true); }
  window.scrollTo(0, 0);
}
document.querySelectorAll('.topbar nav button').forEach(btn => btn.addEventListener('click', () => showTab(btn.dataset.tab)));
document.addEventListener('visibilitychange', async () => {  // l'app est restée ouverte pendant la nuit : on passe au nouveau jour
  if (document.hidden || !state.loadedFor || state.loadedFor === parisToday()) return;
  try { await Promise.all([loadToday(), loadBets()]); renderToday(); watchWaiting(); } catch (_) {}
});

(async () => {
  try { await Promise.all([loadToday(), loadStats(), loadBets(), loadSettings()]); renderToday(); renderTrack(); watchWaiting(); }
  catch (e) { document.getElementById('summary').textContent = 'Impossible de joindre le serveur : ' + e.message; }
})();
</script>
